[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-events-bot"
version = "0.1.0"
description = "Validated, deduplicated Berlin event collection pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]
license = { text = "MIT" }

[project.scripts]
berlin-events = "berlin_events.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
