name: Update Berlin events

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-berlin-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect events
        env:
          BERLIN_EVENTS_API_KEY: ${{ secrets.BERLIN_EVENTS_API_KEY }}
        run: python -m berlin_events --config config/sources.json --output runtime/events.json
      - name: Store short-lived event snapshot
        uses: actions/upload-artifact@v4
        with:
          name: berlin-events
          path: runtime/events.json
          retention-days: 1
          if-no-files-found: error
