name: Update Berlin events

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-berlin-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect events
        # Add required API secrets here after configuring an approved source, e.g.:
        # env:
        #   BERLIN_EVENTS_API_KEY: ${{ secrets.BERLIN_EVENTS_API_KEY }}
        run: python -m berlin_events --config config/sources.json --output data/events.json
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "chore: update Berlin events"
          git push
